# ATS settings
CONFIG_ATS_ASSERT_ON_SEND=y

CONFIG_GPIO=y

CONFIG_ETH_NXP_IMX_NETC=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DSA=y
#CONFIG_DSA_TAG_PROTOCOL_NETC=y # not required to set manually as auto selected for netc board if CONFIG_NET_DSA=y
CONFIG_COUNTER=y
#CONFIG_COUNTER_MCUX_GPT=y # not required to set manually as auto selected for mcux board if CONFIG_COUNTER=y
#CONFIG_ETH_NXP_IMX_TX_RING_NUM=7
CONFIG_PTP_CLOCK=y
# required as dependency for CONFIG_PTP_CLOCK due to error in dsa_nxp_imx_netc.c L.562 (should not only be dependant on CONFIG_PTP_CLOCK but also CONFIG_NET_L2_PTP)
CONFIG_NET_L2_PTP=y

CONFIG_NET_L2_ETHERNET_RESERVE_HEADER=y # Required to reserve space for mac header in packets so they are contiguous
CONFIG_ETH_NXP_IMX_TX_RING_BUF_SIZE=1500

### Begin tracing
CONFIG_TRACING=y
CONFIG_PERCEPIO_TRACERECORDER=y
CONFIG_PERCEPIO_TRC_CFG_STREAM_PORT_RINGBUFFER=y
CONFIG_PERCEPIO_TRC_CFG_STREAM_PORT_RINGBUFFER_SIZE=10240
CONFIG_PERCEPIO_TRC_CFG_CTRL_TASK_DELAY=1000

# CONFIG_TRACING_CTF=y
# CONFIG_TRACING_BACKEND_RAM=y
# CONFIG_RAM_TRACING_BUFFER_SIZE=10240

CONFIG_TRACING_PM=n
### End tracing


CONFIG_ATS_VERIFY_ENABLED=y
CONFIG_ATS_VERIFY_LOG_LEVEL=4

#CONFIG_DT_HAS_ETHERNET_PHY_ENABLED=y

# Generic networking options
CONFIG_NETWORKING=y
CONFIG_NET_UDP=n
CONFIG_NET_TCP=n
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_PACKET=y
CONFIG_POSIX_API=n
CONFIG_NET_CONTEXT_RCVTIMEO=n
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# Kernel options
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_INIT_STACKS=y

# Network buffers
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_CONTEXT_NET_PKT_POOL=y

# Network shell
CONFIG_NET_SHELL=n

# Assertions
CONFIG_ASSERT=y

# Logging
CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_NET_STATISTICS=y
CONFIG_PRINTK=y
CONFIG_LOG_BACKEND_NATIVE_POSIX=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_ATS_LOG_LEVEL=4

CONFIG_NET_SOCKETS_LOG_LEVEL_DBG=n
CONFIG_NET_CONTEXT_LOG_LEVEL_DBG=n
CONFIG_NET_CORE_LOG_LEVEL_DBG=n
CONFIG_NET_CONN_LOG_LEVEL_DBG=n
CONFIG_NET_IF_LOG_LEVEL_DBG=n
CONFIG_NET_L2_ETHERNET_LOG_LEVEL_DBG=n
CONFIG_ETHERNET_LOG_LEVEL_DBG=y
CONFIG_NET_PKT_LOG_LEVEL_ERR=n
